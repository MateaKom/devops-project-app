apiVersion: v1
kind: ServiceAccount
metadata:
  name: ticketing-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ticketing-role
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ticketing-rolebinding
subjects:
  - kind: ServiceAccount
    name: ticketing-sa
roleRef:
  kind: Role
  name: ticketing-role
  apiGroup: rbac.authorization.k8s.io
